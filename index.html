<!DOCTYPE html>
<html>
<head>
  <title>Flare•chat by FLARErayt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-main: linear-gradient(135deg, #0a0a0a 0%, #2a0000 100%);
      --bg-panel: rgba(20, 20, 20, 0.9);
      --bg-msg: #2a2a2a;
      --accent: #ff5722;
      --accent-glow: 0 0 10px rgba(255, 87, 34, 0.8);
      --text: #ffffff;
      --text-muted: #888888;
    }
    body.theme-dark { --bg-main: #121212; --bg-panel: #1e1e1e; --bg-msg: #2a2a2a; --accent: #ff5722; --accent-glow: none; --text: #ffffff; --text-muted: #888888; }
    body.theme-light { --bg-main: #f0f0f0; --bg-panel: #ffffff; --bg-msg: #e0e0e0; --accent: #ff5722; --accent-glow: none; --text: #121212; --text-muted: #666666; }

    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: var(--bg-main); color: var(--text); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; transition: background 0.3s; }

    #splash-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 0.5s; }
    #splash-screen h1 { color: var(--accent); font-size: 3em; margin: 0; text-shadow: var(--accent-glow); }
    #lets-go-btn { margin-top: 40px; background: var(--accent); color: #fff; border: none; padding: 15px 40px; border-radius: 30px; font-size: 1.2em; font-weight: bold; cursor: pointer; box-shadow: var(--accent-glow); }

    #login-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 900; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .login-box { background: var(--bg-panel); padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
    input { padding: 15px; border-radius: 15px; border: 1px solid #333; background: var(--bg-main); color: var(--text); outline: none; }
    .login-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer; }

    #main-screen { display: none; width: 100%; height: 100%; }
    #nav-sidebar { width: 70px; background: var(--bg-panel); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; }
    .nav-icon { font-size: 1.5em; cursor: pointer; padding: 10px; border-radius: 15px; }
    
    #chat-list-area { width: 100%; max-width: 350px; background: var(--bg-panel); display: flex; flex-direction: column; border-right: 1px solid #333; }
    #search-bar { padding: 15px; }
    #search-input { width: 100%; padding: 12px; border-radius: 20px; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; }
    
    #chat-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
    .chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
    .chat-item:hover { background: rgba(255,255,255,0.05); }
    .avatar { width: 45px; height: 45px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 15px; }
    .channel-avatar { background: #0088cc; } /* Синий цвет для канала */

    #chat-area { flex: 1; display: none; flex-direction: column; background: var(--bg-main); }
    #chat-header { background: var(--bg-panel); padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; }
    #back-btn { font-size: 1.5em; margin-right: 15px; cursor: pointer; color: var(--accent); }
    #messages { list-style: none; margin: 0; padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
    .message { padding: 10px 15px; background: var(--bg-msg); border-radius: 15px; margin-bottom: 10px; width: fit-content; max-width: 80%; }
    .message.my-msg { align-self: flex-end; background: var(--accent); color: white; }
    
    #form { display: flex; padding: 10px; background: var(--bg-panel); border-top: 1px solid #333; align-items: center; }
    #message-input { flex: 1; padding: 15px; border-radius: 20px; border: none; background: rgba(0,0,0,0.3); color: white; outline: none; margin-right: 10px; }
    .send-btn { background: var(--accent); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2em; cursor: pointer; }
    #casino-btn { background: #ffd700; color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; font-weight: bold; cursor: pointer; margin-right: 10px; display: none; }
  </style>
</head>
<body class="theme-flare">

  <div id="splash-screen">
    <h1>Flare•chat</h1>
    <p style="color: var(--text-muted);">by FLARErayt</p>
    <p style="color: var(--text); font-size: 1.5em; margin-top: 30px; font-weight: bold;">РАД ВАС видеть!</p>
    <button id="lets-go-btn">Let's GO!</button>
  </div>

  <div id="login-screen">
    <div class="login-box">
      <h2 style="text-align: center; color: var(--accent);">Вход</h2>
      <input type="text" id="username-input" placeholder="@user" maxlength="15">
      <input type="password" id="password-input" placeholder="Пароль">
      <button class="login-btn" id="login-btn">ВХОД</button>
      <div id="login-error" style="color: #ff5252; text-align: center;"></div>
    </div>
  </div>

  <div id="main-screen">
    <div id="nav-sidebar">
      <div class="nav-icon active" id="nav-home">💬</div>
      <div class="nav-icon" id="nav-profile">👤</div>
    </div>

    <div id="chat-list-area">
      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Поиск людей (например @test)...">
      </div>
      <ul id="chat-list"></ul>
    </div>

    <div id="chat-area">
      <div id="chat-header">
        <div id="back-btn">←</div>
        <div id="chat-title">Чат</div>
      </div>
      <ul id="messages"></ul>
      <form id="form">
        <input id="message-input" autocomplete="off" placeholder="Сообщение..." />
        <button type="button" id="casino-btn">777</button>
        <button type="submit" class="send-btn">➤</button>
      </form>
    </div>
  </div>

  <script src="https://flare-chat-e89g.onrender.com/socket.io/socket.io.js"></script>
  <script>
    var socket = io("https://flare-chat-e89g.onrender.com");
    var username = "";
    var currentChat = ""; 

    const splashScreen = document.getElementById('splash-screen');
    const loginScreen = document.getElementById('login-screen');
    const mainScreen = document.getElementById('main-screen');
    const loginBtn = document.getElementById('login-btn');
    const usernameInput = document.getElementById('username-input');
    const passwordInput = document.getElementById('password-input');
    const errorDiv = document.getElementById('login-error');
    
    const chatList = document.getElementById('chat-list');
    const searchInput = document.getElementById('search-input');
    const chatArea = document.getElementById('chat-area');
    const chatListArea = document.getElementById('chat-list-area');
    const chatTitle = document.getElementById('chat-title');
    const messagesList = document.getElementById('messages');
    const form = document.getElementById('form');
    const messageInput = document.getElementById('message-input');
    const backBtn = document.getElementById('back-btn');
    const casinoBtn = document.getElementById('casino-btn');
    const navSidebar = document.getElementById('nav-sidebar');

    // --- ТВОИ НОВОСТИ В КАНАЛЕ (МЕНЯЙ ТУТ) ---
    const channelMessages = [
      { user: "FlareChatNEW", text: "Добро пожаловать в официальный канал Flare•chat!", time: "12:00" },
      { user: "FlareChatNEW", text: "Мы подключили MongoDB. Теперь история сообщений не удаляется!", time: "12:05" },
      { user: "FlareChatNEW", text: "Скоро добавим красивые аватарки и уведомления.", time: "12:10" }
    ];

    document.getElementById('lets-go-btn').addEventListener('click', () => {
      splashScreen.style.opacity = '0';
      setTimeout(() => { splashScreen.style.display = 'none'; loginScreen.style.display = 'flex'; }, 500);
    });

    // АВТОВХОД (Фикс: больше не надо вводить пароль каждый раз)
    socket.on('connect', () => {
      const savedUser = localStorage.getItem('flare-user');
      const savedPass = localStorage.getItem('flare-pass');
      if (savedUser && savedPass) {
        socket.emit('login', { username: savedUser, password: savedPass });
      }
    });

    loginBtn.addEventListener('click', () => {
      var u = usernameInput.value.trim().replace('@', '');
      var p = passwordInput.value;
      if (!u || !p) { errorDiv.innerText = "Заполни поля!"; return; }
      
      localStorage.setItem('flare-user', u);
      localStorage.setItem('flare-pass', p);
      
      socket.emit('login', { username: u, password: p });
    });

    socket.on('login success', (user) => {
      username = user;
      loginScreen.style.display = 'none';
      mainScreen.style.display = 'flex';
      renderChatList();
    });

    socket.on('login error', (msg) => { 
      errorDiv.innerText = msg; 
      localStorage.removeItem('flare-user');
      localStorage.removeItem('flare-pass');
    });

    let allUsers = [];
    socket.on('online users', (users) => {
      allUsers = users;
      renderChatList();
    });

    // Поиск фильтрует только тех, кого ты ищешь
    searchInput.addEventListener('input', renderChatList);

    function renderChatList() {
      const query = searchInput.value.toLowerCase().replace('@', '');
      
      // Всегда показываем Общий чат и Канал
      let listToRender = [
        {name: 'global', displayName: 'Общий чат', isGlobal: true},
        {name: 'channel', displayName: 'FlareChatNEW', isChannel: true}
      ];

      // Если ввели поиск — ищем людей
      if (query.length > 0) {
        let filtered = allUsers.filter(u => u.toLowerCase().includes(query) && u !== username);
        filtered.forEach(u => listToRender.push({name: u, displayName: '@' + u}));
      } else {
        // Если поиска нет — показываем только бота
        if (allUsers.includes('FLARE-desk')) {
           listToRender.push({name: 'FLARE-desk', displayName: '@FLARE-desk'});
        }
      }
      
      chatList.innerHTML = '';
      listToRender.forEach(item => {
        const li = document.createElement('li');
        li.className = 'chat-item';
        
        let avatarLetter = item.isGlobal ? '#' : (item.isChannel ? 'F' : item.displayName.replace('@','').charAt(0).toUpperCase());
        let avatarClass = 'avatar' + (item.isChannel ? ' channel-avatar' : '');
        
        li.innerHTML = `
          <div class="${avatarClass}">${avatarLetter}</div>
          <div class="chat-info">
            <div class="chat-name">${item.displayName}</div>
          </div>
        `;
        li.addEventListener('click', () => openChat(item));
        chatList.appendChild(li);
      });
    }

    function openChat(item) {
      currentChat = item.name;
      chatTitle.innerText = item.displayName;
      chatListArea.style.display = 'none';
      navSidebar.style.display = 'none';
      chatArea.style.display = 'flex';
      messagesList.innerHTML = ''; 
      
      if (item.isChannel) {
        // В КАНАЛЕ ПИСАТЬ НЕЛЬЗЯ
        form.style.display = 'none';
        casinoBtn.style.display = 'none';
        // Рисуем новости
        channelMessages.forEach(msg => addMessageToScreen(msg, false));
      } else {
        form.style.display = 'flex';
        if (item.name === 'FLARE-desk') {
          casinoBtn.style.display = 'flex';
        } else {
          casinoBtn.style.display = 'none';
        }
        
        if (item.name === 'global') {
          socket.emit('get history'); 
        }
      }
      messageInput.focus();
    }

    backBtn.addEventListener('click', () => {
      chatArea.style.display = 'none';
      chatListArea.style.display = 'flex';
      navSidebar.style.display = 'flex';
      currentChat = "";
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!messageInput.value || currentChat === 'channel') return; 
      
      if (currentChat === 'global') {
        socket.emit('chat message', { text: messageInput.value });
      } else if (currentChat !== "") {
        socket.emit('private message', { to: currentChat, text: messageInput.value });
      }
      messageInput.value = '';
    });

    casinoBtn.addEventListener('click', function() {
      if (currentChat === 'FLARE-desk') {
        socket.emit('private message', { to: 'FLARE-desk', text: '777' });
      }
    });

    function addMessageToScreen(data) {
      const isMine = (data.user === username || data.from === username);
      const item = document.createElement('li');
      item.className = 'message' + (isMine ? ' my-msg' : '');
      
      const senderName = data.user || data.from;
      
      item.innerHTML = `
        <div class="meta" style="font-size: 0.75em; color: rgba(255,255,255,0.6); margin-bottom: 5px; display: flex; justify-content: space-between; gap: 10px;">
          <span>${isMine ? 'Вы' : '@' + senderName}</span>
          <span>${data.time}</span>
        </div>
        <div class="text">${data.text}</div>
      `;
      messagesList.appendChild(item);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    socket.on('chat history', (history) => { 
      if(currentChat === 'global') {
        messagesList.innerHTML = '';
        history.forEach(msg => addMessageToScreen(msg)); 
      }
    });
    
    socket.on('chat message', (data) => { if (currentChat === 'global') addMessageToScreen(data); });
    
    socket.on('private message', (data) => { 
      if (currentChat === data.from || currentChat === data.to) {
        addMessageToScreen(data);
      }
    });

    document.getElementById('nav-home').addEventListener('click', () => {
      chatListArea.style.display = 'flex';
      chatArea.style.display = 'none';
      navSidebar.style.display = 'flex';
    });
    
    document.getElementById('nav-profile').addEventListener('click', () => {
      alert("Профиль пользователя: @" + username);
    });
  </script>
</body>
</html>
